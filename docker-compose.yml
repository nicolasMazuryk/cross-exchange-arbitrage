version: '3.8'

services:
  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - arbinet

networks:
  arbinet:
    driver: bridge
