app:
  name: "ArbiNet"
  version: "1.0.0"
  logLevel: "info"

redis:
  url: "redis://localhost:6379"  # Redis connection URL
  # keyPrefix: "arbinet:"
  keyPrefix: "funding:"

exchanges:
  enabled:
    - "binance"
    - "bybit"
    - "okx"
    - "bitget"
    - "gateio"
  binance:
    maxStreamsPerConnection: 100 # Binance combined stream URL limit (~8KB) constrains to ~200 symbols per connection
    reconnectInterval: 5000
    fees:
      spot:
        maker: 0.10
        taker: 0.10
      linear:
        maker: 0.02
        taker: 0.05
      inverse:
        maker: 0.02
        taker: 0.05
    ignoredMarkets: ["BTC/USDT", "BTC/USDT:USDT", "ETH/USDT", "ETH/USDT:USDT", "BNB/USDT", "BNB/USDT:USDT", "XRP/USDT", "XRP/USDT:USDT", "SOL/USDT", "SOL/USDT:USDT", "TRX/USDT", "TRX/USDT:USDT", "HYPE/USDT", "HYPE/USDT:USDT", "DOGE/USDT", "DOGE/USDT:USDT", "LEO/USDT", "LEO/USDT:USDT", "XLM/USDT", "XLM/USDT:USDT", "ADA/USDT", "ADA/USDT:USDT", "XMR/USDT", "XMR/USDT:USDT"]
    enabledMarketTypes: ["linear", "spot"]
    enabledQuoteCurrencies: ['USDT']
    disabledQuoteCurrencies: ["BRL"]
  bybit:
    maxStreamsPerConnection: 50 # max 60 streams per connection
    reconnectInterval: 5000
    fees:
      spot:
        maker: 0.10
        taker: 0.10
      linear:
        maker: 0.036
        taker: 0.10
      inverse:
        maker: 0.036
        taker: 0.10
    ignoredMarkets: ["ETHBTC/USDT:USDT", "USDC/USDT:USDT", "SLF/USDT:USDT", "BTC/USDT", "BTC/USDT:USDT", "ETH/USDT", "ETH/USDT:USDT", "BNB/USDT", "BNB/USDT:USDT", "XRP/USDT", "XRP/USDT:USDT", "SOL/USDT", "SOL/USDT:USDT", "TRX/USDT", "TRX/USDT:USDT", "HYPE/USDT", "HYPE/USDT:USDT", "DOGE/USDT", "DOGE/USDT:USDT", "LEO/USDT", "LEO/USDT:USDT", "XLM/USDT", "XLM/USDT:USDT", "ADA/USDT", "ADA/USDT:USDT", "XMR/USDT", "XMR/USDT:USDT"]
    enabledMarketTypes: ["linear", "spot"]
    enabledQuoteCurrencies: ['USDT']
    disabledQuoteCurrencies: ["BRL"]
    ignoredFundingSymbols:
      - "USDC/USDT:USDT"
      - "ETHBTC/USDT:USDT"
      - "ETH/TRY"
  okx:
    maxStreamsPerConnection: 100 # new connection requests - 3/sec; Subscribe/unsubscribe/login messages per connection - 480/hour
    reconnectInterval: 5000
    fees:
      spot:
        maker: 0.10
        taker: 0.10
      linear:
        maker: 0.02
        taker: 0.05
      inverse:
        maker: 0.02
        taker: 0.05
    ignoredMarkets: ["BTC/USDT", "BTC/USDT:USDT", "ETH/USDT", "ETH/USDT:USDT", "BNB/USDT", "BNB/USDT:USDT", "XRP/USDT", "XRP/USDT:USDT", "SOL/USDT", "SOL/USDT:USDT", "TRX/USDT", "TRX/USDT:USDT", "HYPE/USDT", "HYPE/USDT:USDT", "DOGE/USDT", "DOGE/USDT:USDT", "LEO/USDT", "LEO/USDT:USDT", "XLM/USDT", "XLM/USDT:USDT", "ADA/USDT", "ADA/USDT:USDT", "XMR/USDT", "XMR/USDT:USDT"]
    enabledMarketTypes: ["linear", "spot"]
    enabledQuoteCurrencies: ['USDT']
    disabledQuoteCurrencies: ["BRL"]
  bitget:
    maxStreamsPerConnection: 500 # max connections per IP - 100; max subscriptions per connection - 1000; max subscription messages per hour - 240 per connection; max messages per second per connection - 10 (includes PING, subs)
    reconnectInterval: 5000
    fees:
      spot:
        maker: 0.10
        taker: 0.10
      linear:
        maker: 0.036
        taker: 0.10
      inverse:
        maker: 0.036
        taker: 0.10
    ignoredMarkets: ["BTC/USDT", "BTC/USDT:USDT", "ETH/USDT", "ETH/USDT:USDT", "BNB/USDT", "BNB/USDT:USDT", "XRP/USDT", "XRP/USDT:USDT", "SOL/USDT", "SOL/USDT:USDT", "TRX/USDT", "TRX/USDT:USDT", "HYPE/USDT", "HYPE/USDT:USDT", "DOGE/USDT", "DOGE/USDT:USDT", "LEO/USDT", "LEO/USDT:USDT", "XLM/USDT", "XLM/USDT:USDT", "ADA/USDT", "ADA/USDT:USDT", "XMR/USDT", "XMR/USDT:USDT"]
      # - "DegenReborn/USDT:USDT"
    enabledMarketTypes: ["linear", "spot"]
    enabledQuoteCurrencies: ['USDT']
    disabledQuoteCurrencies: ["BRL"]
  gateio:
    maxStreamsPerConnection: 100
    reconnectInterval: 5000
    fees:
      spot:
        maker: 0.10
        taker: 0.10
      linear:
        maker: 0.02
        taker: 0.05
      inverse:
        maker: 0.02
        taker: 0.05
    ignoredMarkets: ["BTC/USDT", "BTC/USDT:USDT", "ETH/USDT", "ETH/USDT:USDT", "BNB/USDT", "BNB/USDT:USDT", "XRP/USDT", "XRP/USDT:USDT", "SOL/USDT", "SOL/USDT:USDT", "TRX/USDT", "TRX/USDT:USDT", "HYPE/USDT", "HYPE/USDT:USDT", "DOGE/USDT", "DOGE/USDT:USDT", "LEO/USDT", "LEO/USDT:USDT", "XLM/USDT", "XLM/USDT:USDT", "ADA/USDT", "ADA/USDT:USDT", "XMR/USDT", "XMR/USDT:USDT"]

trackedPairs:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - ADAUSDT
  - DOGEUSDT

# Minimum arbitrage peers a market must have to be subscribed (perf: fewer WS streams).
# A peer = a leg sharing the same normalized base/quote that is NOT (same exchange AND same type).
# 0 = disabled (subscribe all). 1 = drop unpairable singletons. 2+ = require N counterparts.
minMarketPeers: 1

trading:
  orderAmountUsd: 100  # in USDT, default order size for arbitrage opportunities
  maxPositionAmountUsd: 120  # maximum position amount in USD
  minBalanceBufferPercent: 10  # minimum balance buffer in percent
  orderConfirmationTimeoutMs: 10000  # 10 seconds timeout for order confirmation
  leverage: 4  # leverage multiplier for trading (1 = no leverage)
  monitor:
    maxHoldTimeMs: 31536000000  # 365 days max hold time
    checkIntervalMs: 5000  # 5 second check interval
    # Exit Persistence Validation
    exitMinPersistenceMs: 1000  # minimum time window for exit condition persistence (2 seconds)
    exitMinConsecutiveSnapshots: 3  # minimum consecutive snapshots showing the exit condition
    exitCandidateCleanupMs: 5000  # cleanup stale exit candidates after 10 seconds

arbitrage: # pairs require > $20 to enter minimum order size
  blacklistPairs: ['BTC/USDT:USDT', 'ETH/USDT:USDT', 'SUI/USDT:USDT', 'XAUT/USDT:USDT', 'AAVE/USDT:USDT']  # pairs to exclude from arbitrage
  minConfidenceScore: 0.7  # minimum confidence score for opportunities (0-1 range)
  maxMarketSpreadPercent: 0.3  # maximum market spread width within an exchange in percent
  maxAnomalySpreadThresholdPercent: 1000000000000000.0  # maximum anomaly profit threshold in percent
  maxOrderbookAge: 2000  # maximum orderbook age in milliseconds
  orderAmountToleranceMinPercent: 60  # minimum order amount tolerance in percent of order amount
  orderAmountToleranceMaxPercent: 140  # maximum order amount tolerance in percent of order amount
  # Temporal Persistence Validation
  minPersistenceMs: 1000  # minimum time window for opportunity persistence (500ms)
  minConsecutiveSnapshots: 3  # minimum consecutive snapshots showing the opportunity
  candidateCleanupMs: 5000  # cleanup stale candidates after 5 seconds
  sellSpotBuyPerpEnabled: false  # Enable SELL spot + BUY perp direction. Requires holding spot inventory. Default false.

accountSync:
  maxStateAgeMs: 30000  # maximum age of account state data in milliseconds (30 seconds)
  snapshotIntervalMs: 180000  # interval for periodic snapshots in milliseconds (3 minutes)

performanceMonitor:
  enabled: true      # config-gated; flip off without code change
  intervalMs: 10000  # flush one structured process-health sample every 10s

ingest:
  enabled: true  # per-exchange WS ingest workers (worker_threads); false = legacy in-process path (rollback lever)
  depth: 20      # levels per side shipped worker -> main per book message (feeds simulateSlippage depth walk)
  # Explicit worker topology (Phase 3). Exchanges without an entry get one worker for
  # all market types. Listing an exchange splits it — market types NOT listed are NOT
  # subscribed for that exchange (config load fails on typos/duplicates/overlap).
  workers:
    - exchange: bybit
      marketType: spot
    - exchange: bybit
      marketType: linear

funding:
  fetchIntervalMs: 20000  # fetch funding rates every 20 seconds using browser automation
  maxDataAgeMs: 120000  # consider funding data stale after 2 minutes
  supportedExchanges:
    - "binance"
    - "bybit"
    - "okx"
    - "bitget"
  # Funding Arbitrage Projection Settings
  projectionHours: 10  # number of hours to project funding profitability

fundingFeeCollector:
  cronPattern: "0 3 * * * *"  # Run at 3 minutes after every hour (sec min hour day month dayOfWeek)

strategy:
  # Funding Arbitrage Strategy Configuration
  funding:
    enabled: false  # Enable/disable funding arbitrage strategy
    entryWindowStart: 120  # Start entry execution window in seconds before next funding event
    entryWindowEnd: 5  # End entry execution window in seconds before next funding event
    exitWindowStart: 120  # (Convergence) Start exit execution window in seconds BEFORE NEXT funding event
    exitWindowEnd: 5  # (Convergence) End exit execution window in seconds before next funding event
    exitWindowStartTakeProfitStopLoss: 120  # (Take-profit / spread-widening) Start exit window in seconds AFTER PREVIOUS funding event
    exitWindowEndTakeProfitStopLoss: 5  # (Take-profit / spread-widening) End exit window in seconds before next funding event
    minFundingProfitPercent: 0.10  # Minimum funding difference in percent after costs for SYNC or cumulative profit for ASYNC
    minTotalProfitPercent: 0.00  # Minimum acceptable net profit in percent after all costs
    # Exit Conditions
    takeProfitTargetPercent: 0.2  # Exit when take profit target is reached: (entry spread - current spread) + funding - costs > takeProfitTargetPercent
    convergenceThresholdPercent: 0.01  # Exit funding trade when funding diff drops below this percent
    minFundingProfitAsyncSyncExitPercent: 0.10  # Minimum cumulative funding rate in percent for nextPlusOneSync ASYNC-SYNC exit
    spreadWideningThresholdPercent: 0.2  # Exit if spread widens excessively beyond this percent threshold
  
  # Spread Arbitrage Strategy Configuration
  spread:
    enabled: true  # Enable/disable spread arbitrage strategy
    fundingProfitEnabled: false  # Include projected funding in profit estimation and entry validation
    entryWindowStart: 8  # Start entry execution window in seconds after previous funding event
    entryWindowEnd: 14000  # End entry execution window in seconds before next funding event
    exitWindowStart: 8  # Start exit execution window in seconds after previous funding event
    exitWindowEnd: 2  # End exit execution window in seconds before next funding event
    minSpreadProfitPercent: 0.4  # Minimum spread profit in percent after costs
    minTotalProfitPercent: -0.1  # Minimum acceptable net profit in percent after all costs
    negativeFundingMultiplier: 2  # Reduce exposure when funding difference is negative
    # Exit Conditions
    takeProfitTargetPercent: 0.4  # Exit when take profit target is reached: (entry spread - current spread) + funding - costs > takeProfitTargetPercent
    convergenceThresholdPercent: 0.0  # convergence threshold in percent for exits
    spreadWideningThresholdPercent: 5.0  # Exit if spread widens excessively beyond this percent threshold