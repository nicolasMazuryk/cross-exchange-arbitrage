app:
  name: "ArbiNet"
  version: "1.0.0"
  environment: "development"

logging:
  level: "debug"
  format: "json"
  file: "logs/app.log"

exchanges:
  enabled:
    - "binance"
    - "bybit"
    - "okx"
    - "bitget"
    - "gateio"
  binance:
    maxStreamsPerConnection: 1000 # max 1024 streams per connection
    reconnectInterval: 5000
    fees:
      maker: 0.0002 # 0.02%
      taker: 0.0005 # 0.05%
    ignoredMarkets: []
  bybit:
    maxStreamsPerConnection: 50 # max 60 streams per connection
    reconnectInterval: 5000
    fees:
      maker: 0.0002 # 0.02%
      taker: 0.00055 # 0.055%
    ignoredMarkets:
      - "ETHBTC/USDT:USDT"
      - "USDC/USDT:USDT"
  okx:
    maxStreamsPerConnection: 100 # new connection requests - 3/sec; Subscribe/unsubscribe/login messages per connection - 480/hour
    reconnectInterval: 5000
    fees:
      maker: 0.0002 # 0.02%
      taker: 0.0005 # 0.05%
    ignoredMarkets: []
  bitget:
    maxStreamsPerConnection: 500 # max connections per IP - 100; max subscriptions per connection - 1000; max subscription messages per hour - 240 per connection; max messages per second per connection - 10 (includes PING, subs)
    reconnectInterval: 5000
    fees:
      maker: 0.0002 # 0.02%
      taker: 0.0006 # 0.06%
    ignoredMarkets:
      - "DegenReborn/USDT:USDT"
  gateio:
    maxStreamsPerConnection: 100
    reconnectInterval: 5000
    fees:
      maker: 0.0002 # 0.02%
      taker: 0.0005 # 0.05%
    ignoredMarkets: []

trackedPairs:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - ADAUSDT
  - DOGEUSDT

trading:
  orderAmount: 10  # in USDT, default order size for arbitrage opportunities
  minBalanceBuffer: 0.1  # 10% buffer for balance validation
  positionLimitMultiplier: 1  # multiplier for position size limits
  orderConfirmationTimeoutMs: 10000  # 10 seconds timeout for order confirmation
  monitor:
    maxHoldTimeMs: 1000 * 60 * 60 * 24  # 24 hours max hold time
    convergenceBufferPercent: 0.00  # 0.05% convergence buffer
    checkIntervalMs: 5000  # 5 second check interval
    # Exit Persistence Validation
    exitMinPersistenceMs: 1000  # minimum time window for exit condition persistence (2 seconds)
    exitMinConsecutiveSnapshots: 3  # minimum consecutive snapshots showing the exit condition
    exitCandidateCleanupMs: 5000  # cleanup stale exit candidates after 10 seconds

arbitrage:
  blacklistPairs: []  # pairs to exclude from arbitrage
  minConfidenceScore: 0.7  # minimum confidence score for opportunities
  maxMarketSpread: 0.002  # maximum market spread width within an exchange (0.2%)
  maxCrossMarketSpread: 0.10  # maximum cross-market spread between exchanges (10%)
  maxOrderbookAge: 2000  # maximum orderbook age in milliseconds
  minProfitThreshold: 0.005  # 0.2%
  orderAmountToleranceMin: 0.60  # minimum order amount tolerance (60% of order amount)
  orderAmountToleranceMax: 1.40  # maximum order amount tolerance (140% of order amount)
  # Temporal Persistence Validation
  minPersistenceMs: 1000  # minimum time window for opportunity persistence (500ms)
  minConsecutiveSnapshots: 3  # minimum consecutive snapshots showing the opportunity
  candidateCleanupMs: 5000  # cleanup stale candidates after 5 seconds

accountSync:
  maxStateAgeMs: 30000  # maximum age of account state data in milliseconds (30 seconds)
  snapshotIntervalMs: 180000  # interval for periodic snapshots in milliseconds (3 minutes)

funding:
  fetchIntervalMs: 60000  # fetch funding rates every 60 seconds using browser automation
  maxDataAgeMs: 120000  # consider funding data stale after 2 minutes
  minFundingDifferential: 0.002  # minimum funding differential to consider (0.2%)
  supportedExchanges:
    - "binance"
    - "bybit"
    - "okx"
    - "bitget"