app:
  name: "ArbiNet"
  version: "1.0.0"
  environment: "development"

logging:
  level: "debug"
  format: "json"
  file: "logs/app.log"

exchanges:
  enabled:
    - "binance"
    - "bybit"
    - "okx"
    - "bitget"
    - "gateio"
  binance:
    maxStreamsPerConnection: 1000 # max 1024 streams per connection
    reconnectInterval: 5000
  bybit:
    maxStreamsPerConnection: 50 # max 60 streams per connection
    reconnectInterval: 5000
  okx:
    maxStreamsPerConnection: 100
    reconnectInterval: 5000
  bitget:
    maxStreamsPerConnection: 100
    reconnectInterval: 5000
  gateio:
    maxStreamsPerConnection: 100
    reconnectInterval: 5000

trackedPairs:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - ADAUSDT
  - DOGEUSDT

trading:
  maxPositionAmount: 20  # in USDT
  minProfitThreshold: 0.002  # 0.2%
  maxSlippage: 0.002  # 0.2%
  executionTimeout: 5000  # ms