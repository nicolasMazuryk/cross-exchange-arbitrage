app:
  name: "ArbiNet"
  version: "1.0.0"
  environment: "development"

logging:
  level: "debug"
  format: "json"
  file: "logs/app.log"

exchanges:
  enabled:
    - "binance"
    - "bybit"
    - "okx"
    - "bitget"
    - "gateio"
  binance:
    maxStreamsPerConnection: 1000 # max 1024 streams per connection
    reconnectInterval: 5000
    fees:
      maker: 0.0002 # 0.02%
      taker: 0.0005 # 0.05%
    ignoredMarkets: []
  bybit:
    maxStreamsPerConnection: 50 # max 60 streams per connection
    reconnectInterval: 5000
    fees:
      maker: 0.00036 # 0.036%
      taker: 0.00100 # 0.10%
    ignoredMarkets:
      - "ETHBTC/USDT:USDT"
      - "USDC/USDT:USDT"
      - "SLF/USDT:USDT"
  okx:
    maxStreamsPerConnection: 100 # new connection requests - 3/sec; Subscribe/unsubscribe/login messages per connection - 480/hour
    reconnectInterval: 5000
    fees:
      maker: 0.0002 # 0.02%
      taker: 0.0005 # 0.05%
    ignoredMarkets: []
  bitget:
    maxStreamsPerConnection: 500 # max connections per IP - 100; max subscriptions per connection - 1000; max subscription messages per hour - 240 per connection; max messages per second per connection - 10 (includes PING, subs)
    reconnectInterval: 5000
    fees:
      maker: 0.00036 # 0.036%
      taker: 0.00100 # 0.10%
    ignoredMarkets:
      - "DegenReborn/USDT:USDT"
  gateio:
    maxStreamsPerConnection: 100
    reconnectInterval: 5000
    fees:
      maker: 0.0002 # 0.02%
      taker: 0.0005 # 0.05%
    ignoredMarkets: []

trackedPairs:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - ADAUSDT
  - DOGEUSDT

trading:
  orderAmount: 10  # in USDT, default order size for arbitrage opportunities
  minBalanceBuffer: 0.1  # 10% buffer for balance validation
  positionLimitMultiplier: 1  # multiplier for position size limits
  orderConfirmationTimeoutMs: 10000  # 10 seconds timeout for order confirmation
  monitor:
    maxHoldTimeMs: 86400000  # 24 hours max hold time
    checkIntervalMs: 5000  # 5 second check interval
    # Exit Persistence Validation
    exitMinPersistenceMs: 1000  # minimum time window for exit condition persistence (2 seconds)
    exitMinConsecutiveSnapshots: 3  # minimum consecutive snapshots showing the exit condition
    exitCandidateCleanupMs: 5000  # cleanup stale exit candidates after 10 seconds

arbitrage: # pairs require > $20 to enter minimum order size
  blacklistPairs: ['BTC/USDT:USDT', 'ETH/USDT:USDT', 'SUI/USDT:USDT', 'XAUT/USDT:USDT']  # pairs to exclude from arbitrage
  minConfidenceScore: 0.7  # minimum confidence score for opportunities
  maxMarketSpread: 0.002  # maximum market spread width within an exchange (0.2%)
  maxAnomalySpreadThreshold: 0.10  # maximum anomaly profit including cross-market spread between exchanges and funding rate difference (10%)
  maxOrderbookAge: 2000  # maximum orderbook age in milliseconds
  orderAmountToleranceMin: 0.60  # minimum order amount tolerance (60% of order amount)
  orderAmountToleranceMax: 1.40  # maximum order amount tolerance (140% of order amount)
  # Temporal Persistence Validation
  minPersistenceMs: 1000  # minimum time window for opportunity persistence (500ms)
  minConsecutiveSnapshots: 3  # minimum consecutive snapshots showing the opportunity
  candidateCleanupMs: 5000  # cleanup stale candidates after 5 seconds

accountSync:
  maxStateAgeMs: 30000  # maximum age of account state data in milliseconds (30 seconds)
  snapshotIntervalMs: 180000  # interval for periodic snapshots in milliseconds (3 minutes)

funding:
  fetchIntervalMs: 15000  # fetch funding rates every 60 seconds using browser automation
  maxDataAgeMs: 120000  # consider funding data stale after 2 minutes
  supportedExchanges:
    - "binance"
    - "bybit"
    - "okx"
    - "bitget"
  # Funding Arbitrage Projection Settings
  projectionHours: 20  # number of hours to project funding profitability

strategy:
  # Funding Arbitrage Strategy Configuration
  funding:
    enabled: true  # Enable/disable funding arbitrage strategy
    windowStart: 14400  # Start execution window 600 seconds (10 minutes) before next funding event
    windowEnd: 30  # End execution window 30 seconds before next funding event
    minFundingProfit: -0.002  # Minimum funding difference (0.2%) for SYNC or cumulative profit for ASYNC
    minTotalProfit: -0.005  # Minimum acceptable net profit after all costs (-0.1%)
    # Exit Conditions
    convergenceThreshold: -0.008  # Exit funding trade when funding diff < 0.02%
    spreadWideningThreshold: 0.02  # Exit if spread widens excessively (-2.00%)
  
  # Spread Arbitrage Strategy Configuration
  spread:
    enabled: false  # Enable/disable spread arbitrage strategy
    windowStart: 60  # Start execution window 300 seconds (5 minutes) after previous funding event
    windowEnd: 60  # End execution window 1800 seconds (30 minutes) before next funding event
    windowEndClose: 60  # Close execution window 60 seconds before next funding event (for exits)
    minSpreadProfit: 0.004  # Minimum spread profit (0.2%)
    minTotalProfit: -0.001  # Minimum acceptable net profit after all costs (-0.1%)
    negativeFundingMultiplier: 2  # Reduce exposure when funding difference is negative
    # Exit Conditions
    convergenceThreshold: 0.00  # 0.05% convergence threshold for exits
    spreadWideningThreshold: 0.02  # Exit if spread widens excessively (-2.00%)