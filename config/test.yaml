app:
  name: "ArbiNet"
  version: "1.0.0"
  environment: "test"

logging:
  level: "error"
  format: "json"
  file: "logs/test.log"

redis:
  url: "redis://localhost:6379"

exchanges:
  enabled:
    - "binance"
    - "bybit"
  binance:
    maxStreamsPerConnection: 1000
    reconnectInterval: 5000
    fees:
      maker: 0.02  # in percent
      taker: 0.05  # in percent
    ignoredMarkets: []
  bybit:
    maxStreamsPerConnection: 50
    reconnectInterval: 5000
    fees:
      maker: 0.02  # in percent
      taker: 0.055  # in percent
    ignoredMarkets: []

trackedPairs:
  - BTCUSDT
  - ETHUSDT

trading:
  orderAmount: 10
  minBalanceBufferPercent: 10
  maxPositionAmountUsd: 10
  orderConfirmationTimeoutMs: 10000
  monitor:
    maxHoldTimeMs: 1000 * 60 * 60 * 24
    checkIntervalMs: 5000
    exitMinPersistenceMs: 1000
    exitMinConsecutiveSnapshots: 3
    exitCandidateCleanupMs: 5000

arbitrage:
  blacklistPairs: []
  minConfidenceScore: 0.7
  maxMarketSpreadPercent: 0.2
  maxAnomalySpreadThresholdPercent: 10.0
  maxOrderbookAge: 2000
  orderAmountToleranceMinPercent: 60
  orderAmountToleranceMaxPercent: 140
  minPersistenceMs: 1000
  minConsecutiveSnapshots: 3
  candidateCleanupMs: 5000

accountSync:
  maxStateAgeMs: 30000
  snapshotIntervalMs: 180000

funding:
  fetchIntervalMs: 60000
  maxDataAgeMs: 120000
  supportedExchanges:
    - "binance"
    - "bybit"
  projectionHours: 20
