app:
  name: "ArbiNet"
  version: "1.0.0"
  environment: "test"

logging:
  level: "debug"
  format: "json"
  file: "logs/test.log"

exchanges:
  enabled:
    - "binance"
    - "bybit"
    - "okx"
    - "bitget"
    - "gateio"
  binance:
    maxStreamsPerConnection: 1000
    reconnectInterval: 5000
    fees:
      maker: 0.0002
      taker: 0.0005
  bybit:
    maxStreamsPerConnection: 50
    reconnectInterval: 5000
    fees:
      maker: 0.0002
      taker: 0.00055
  okx:
    maxStreamsPerConnection: 100
    reconnectInterval: 5000
    fees:
      maker: 0.0002
      taker: 0.0005
  bitget:
    maxStreamsPerConnection: 500
    reconnectInterval: 5000
    fees:
      maker: 0.0002
      taker: 0.0006
  gateio:
    maxStreamsPerConnection: 100
    reconnectInterval: 5000
    fees:
      maker: 0.0002
      taker: 0.0005

trackedPairs:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - ADAUSDT
  - DOGEUSDT

trading:
  orderAmount: 10
  minBalanceBuffer: 0.1
  positionLimitMultiplier: 1
  orderConfirmationTimeoutMs: 10000
  monitor:
    maxHoldTimeMs: 1000 * 60 * 60 * 24
    convergenceBufferPercent: 0.01
    checkIntervalMs: 5000

arbitrage:
  blacklistPairs: []
  minConfidenceScore: 0.7
  maxMarketSpread: 0.003
  maxCrossMarketSpread: 0.10
  maxOrderbookAge: 2000
  minProfitThreshold: 0.0015
  orderAmountToleranceMin: 0.60
  orderAmountToleranceMax: 1.40
  minPersistenceMs: 200
  minConsecutiveSnapshots: 3
  candidateCleanupMs: 5000

accountSync:
  maxStateAgeMs: 30000
  snapshotIntervalMs: 180000 