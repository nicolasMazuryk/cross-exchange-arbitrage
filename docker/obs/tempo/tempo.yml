# Dev-local Tempo — body copied from infra/ansible/roles/tempo/templates/
# tempo.yml.j2 (OTLP grpc/http receivers, local block storage). Retention
# dev-scaled to 24h (prod 72h). Alloy forwards OTLP here on tempo:4317.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 24h
