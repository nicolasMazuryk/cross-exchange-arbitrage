version: '3.8'

# Local development stack for the datapipeline:
#   ClickHouse v26 LTS, Redpanda (KRaft), trader, query-api.
# Bind-mounts under ./.dev-data (gitignored). Bridge networking with port mapping.
# No cold S3 disk; storage policy points only at the default volume.

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: arbinet-redpanda-dev
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://127.0.0.1:9092
      - --mode=dev-container
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - ./.dev-data/redpanda:/var/lib/redpanda/data
    restart: unless-stopped
    networks: [arbinet]

  clickhouse:
    image: clickhouse/clickhouse-server:26-lts
    container_name: arbinet-clickhouse-dev
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: arbinet
      CLICKHOUSE_USER: arbinet
      CLICKHOUSE_PASSWORD: arbinet
    volumes:
      - ./.dev-data/clickhouse:/var/lib/clickhouse
      - ./infra/clickhouse/config.dev.d:/etc/clickhouse-server/config.d:ro
      - ./infra/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - ./infra/clickhouse/bootstrap.sql:/docker-entrypoint-initdb.d/bootstrap.sql:ro
    restart: unless-stopped
    networks: [arbinet]

  trader:
    build:
      context: .
      dockerfile: docker/Dockerfile.arbinet
    container_name: arbinet-trader-dev
    env_file: .env
    environment:
      NODE_ENV: development
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_URL: http://clickhouse:8123
    command: ["npx", "ts-node", "src/main.ts"]
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    depends_on: [redpanda, clickhouse]
    restart: unless-stopped
    networks: [arbinet]

  query-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.queryApi
    container_name: arbinet-query-api-dev
    env_file: .env
    environment:
      NODE_ENV: development
      CLICKHOUSE_URL: http://clickhouse:8123
      KAFKA_BROKERS: redpanda:9092
    command: ["npx", "ts-node", "src/services/queryApi/server.ts"]
    ports:
      - "8124:8124"
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    depends_on: [clickhouse, redpanda]
    restart: unless-stopped
    networks: [arbinet]

networks:
  arbinet:
    driver: bridge
