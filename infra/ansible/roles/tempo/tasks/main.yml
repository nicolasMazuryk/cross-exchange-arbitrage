---
# tempo role — config + data dir + compose fragment. Tag: tempo.

- name: Create the tempo config directory
  ansible.builtin.file:
    path: "{{ obs_stack_dir }}/config/tempo"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template the tempo config
  ansible.builtin.template:
    src: tempo.yml.j2
    dest: "{{ obs_stack_dir }}/config/tempo/tempo.yml"
    owner: root
    group: root
    mode: "0644"

- name: Create the tempo data directory (container UID)
  ansible.builtin.file:
    path: "{{ obs_data_root }}/tempo"
    state: directory
    owner: "{{ tempo_uid }}"
    group: "{{ tempo_uid }}"
    mode: "0755"

- name: Template the tempo compose fragment
  ansible.builtin.template:
    src: tempo.yaml.j2
    dest: "{{ obs_stack_dir }}/services/tempo.yaml"
    owner: root
    group: root
    mode: "0644"
