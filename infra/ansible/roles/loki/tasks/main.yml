---
# loki role — config + data dir + compose fragment. Tag: loki.

- name: Create the loki config directory
  ansible.builtin.file:
    path: "{{ obs_stack_dir }}/config/loki"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template the loki config
  ansible.builtin.template:
    src: loki.yml.j2
    dest: "{{ obs_stack_dir }}/config/loki/loki.yml"
    owner: root
    group: root
    mode: "0644"

- name: Create the loki data directory (container UID)
  ansible.builtin.file:
    path: "{{ obs_data_root }}/loki"
    state: directory
    owner: "{{ loki_uid }}"
    group: "{{ loki_uid }}"
    mode: "0755"

- name: Template the loki compose fragment
  ansible.builtin.template:
    src: loki.yaml.j2
    dest: "{{ obs_stack_dir }}/services/loki.yaml"
    owner: root
    group: root
    mode: "0644"
