---
# role_hot — hot-box lean config (task 10). On top of baseline + wireguard the
# hot box (CCX13, dedicated cores, trader app only) needs exactly two obs
# prerequisites: tight chrony clock sync + a LEAN Alloy agent & node_exporter.
# Lean = scrape only node + trader on loopback (no clickhouse/redpanda/query-api/
# spread-computer — those are core-box only); still tails container logs, receives
# OTLP/Pyroscope from the trader SDK, and forwards every signal to the obs box.
# Config-on-host only: Ansible writes config; Kamal (task 13) runs the trader.

# Private-net IP of the hot box. hcloud_private_ipv4 resolves from the dynamic
# inventory; the literal default keeps static/check runs working.
hot_private_ip: "{{ hcloud_private_ipv4 | default('10.0.1.10') }}"

# --- chrony (spec 03 §chrony-role) — same tight config as core --------------
chrony_pools:
  - 0.europe.pool.ntp.org
  - time.cloudflare.com
chrony_minpoll: 4
chrony_maxpoll: 8
chrony_makestep: "0.1 3"
chrony_logdir: /var/log/chrony

# node_exporter loopback bind (mirrors the role default).
node_exporter_listen_address: "127.0.0.1:9100"

# --- lean Alloy collector contract -----------------------------------------
# obs box private IP — every hot-box signal forwards here.
obs_private_ip: "10.0.1.30"
# Per-host external label on remote-write metrics (host="hot") — distinguishes
# hot's job=node series from core's in the obs Prometheus; resolves host= alerts.
alloy_host_label: "hot"
# Hot-path tier = 5s (task 14, spec 05 §scrape-interval). The hot box is
# single-tier — trader /metrics + hot node_exporter are both hot-path — so one
# 5s interval covers every scrape block. A 15s scrape cannot catch sub-second
# hot-path SLO breaches (tick-to-trade, event-loop lag, WS staleness).
alloy_scrape_interval: "5s"
# scrape_timeout must be <= scrape_interval; the 10s default exceeds 5s and makes
# Alloy refuse to start. Pin to 4s — strictly UNDER the 5s interval so a slow or
# hung scrape is cut with ~1s of slack before the next tick (never overlaps).
# Real hot scrape durations are <0.1s (node 65ms, trader <1ms), so 4s is ample.
alloy_scrape_timeout: "4s"
# LEAN: only node + trader. No clickhouse/redpanda/query-api/spread-computer.
alloy_scrape_targets:
  - { job: node, target: "127.0.0.1:9100" }
  - { job: trader, target: "127.0.0.1:9464" }
# Forwarding endpoints built from obs_private_ip.
alloy_remote_write_url: "http://{{ obs_private_ip }}:9090/api/v1/write"
alloy_loki_url: "http://{{ obs_private_ip }}:3100/loki/api/v1/push"
alloy_tempo_endpoint: "{{ obs_private_ip }}:4317"
alloy_pyroscope_url: "http://{{ obs_private_ip }}:4040"
